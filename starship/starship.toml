"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = """
$hostname\
$directory\
(:\\(\
$git_branch\
$git_commit\
$git_state\
$git_status\
\\))\
$python\
$rust\
$golang\
$nodejs\
${custom.java}\
$cmd_duration\
$add_newline
$character
"""

# right_format = """
# $git_metrics\
# """

[character]
success_symbol = '[%](bold green)'
error_symbol = '[%](bold red)'

[cmd_duration]
min_time = 0
show_milliseconds = true
style = "dimmed white"
format = "[ \\($duration\\)]($style) "

[directory]
style = "bold"
truncation_length = 2
format = '[$path]($style)[$read_only]($read_only_style)'

[git_branch]
format = '[$branch(:$remote_branch)]($style)'

[git_commit]
format = '[\($hash$tag\)]($style)'

[git_state]
format = '[{$state( $progress_current/$progress_total)}]($style)'

[git_status]
format = '([\[$all_status$ahead_behind\]]($style))'
deleted = 'x'
ahead = '↑'
behind = '↓'
diverged = "↕"

# [git_metrics]
# disabled = false
# format='( [+$added]($added_style) )([-$deleted]($deleted_style) )'

[hostname]
ssh_symbol = '@'
format = '[$ssh_symbol](bold magenta dimmed)[$hostname](bold blue dimmed):'

[python]
style = 'fg:112 bold'
format = ' [\[${version}( \($virtualenv\))\]]($style)'

[rust]
format = ' [\[$version\]](red bold)'

[golang]
format = ' [\[$version\]](bold cyan)'

[nodejs]
format = ' [\[$version\]](bold green)'

[java]
disabled = true

[custom.java]
detect_files = ['pom.xml', 'build.gradle.kts', 'build.sbt', '.java-version', 'deps.edn', 'project.clj', 'build.boot', '.sdkmanrc', '.classpath']
detect_extensions = ['java', 'class', 'gradle', 'jar', 'cljs', 'cljc']
command = "mise ls --current java | awk '/^java[[:space:]]+/{sub(/^java[[:space:]]+/,\"\"); split($0,a,/[[:space:]]+/); t=a[1]; v=(t~/-/?t:\"openjdk\"); sub(/-[0-9]+\\.[0-9]+\\.[0-9]+(\\+[0-9]+)?$/,\"\",v); match(t,/[0-9]+\\.[0-9]+\\.[0-9]+/); print v \" v\" substr(t,RSTART,RLENGTH); exit}'"
style = "fg:160 bold"
format = " [\\[$output\\]]($style)"
